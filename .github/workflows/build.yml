name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
          - name: macOS-Intel
            os: macos-15-intel
          - name: macOS-Apple-Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-build.txt
      - name: Regression tests
        run: npm test
      - name: Build native engine and Electron app
        run: npm run build
      - name: Verify bundled engine
        run: python scripts/check-bundle.py
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'release/PBB PreAudit-win32-x64/*' -DestinationPath 'release/PBB-PreAudit-Windows-x64.zip'
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          bash scripts/create-dmg.sh "$app" "release/PBB-PreAudit-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: PBB-PreAudit-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish downloadable builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --title "PBB PreAudit $TAG" --notes-file RELEASE_NOTES.md --generate-notes
